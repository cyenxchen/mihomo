name: Trigger Clash Mi VPN Service

on:
  push:
    branches:
      - Meta
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-clashmi-vpn-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch VPN service rebuild
    runs-on: ubuntu-latest

    steps:
      - name: Trigger cyenxchen/clashmi-vpn-service
        env:
          DISPATCH_TOKEN: ${{ secrets.CLASHMI_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${DISPATCH_TOKEN}" ]]; then
            echo "::error::CLASHMI_DISPATCH_TOKEN secret is required to trigger cyenxchen/clashmi-vpn-service"
            exit 1
          fi

          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cyenxchen/clashmi-vpn-service/dispatches \
            -d @- <<JSON
          {
            "event_type": "mihomo-updated",
            "client_payload": {
              "repository": "${GITHUB_REPOSITORY}",
              "ref": "${GITHUB_REF_NAME}",
              "sha": "${GITHUB_SHA}"
            }
          }
          JSON
